name: Kubernetes CD

on:
  repository_dispatch:
    types:
      - deploy

jobs:
  deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ==========================================
      # Checkout Kubernetes Repository
      # ==========================================
      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4

      # ==========================================
      # Checkout Spring Boot Repository
      # ==========================================
      - name: Checkout Spring Boot repository
        uses: actions/checkout@v4
        with:
          repository: Deepak1125/spring-boot-crud-postgres-adminer
          ref: ${{ github.event.client_payload.tag }}
          path: spring-app

      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # Build Docker Image
      # ==========================================
      - name: Build Docker image
        working-directory: spring-app
        run: |
          docker build \
            -t deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }} \
            .

      # ==========================================
      # Push Docker Image
      # ==========================================
      - name: Push Docker image
        run: |
          docker push deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }}

      # ==========================================
      # Create Kind Cluster
      # ==========================================
      - name: Create Kind Cluster
        uses: helm/kind-action@v1

      # ==========================================
      # Verify Cluster
      # ==========================================
      - name: Verify Kubernetes Cluster
        run: |
          kubectl version --client
          kubectl cluster-info
          kubectl get nodes

      # ==========================================
      # Update Java Image Tag
      # ==========================================
      - name: Update image tag
        run: |
          sed -i "s|deepakchandra1125/java-demo-app:latest|deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }}|g" k8s/05-java-deployment.yaml

      # ==========================================
      # Deploy Kubernetes Manifests
      # ==========================================
      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k k8s/

      # ==========================================
      # Wait for PostgreSQL
      # ==========================================
      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status deployment/crud-postgres \
            -n java-demo \
            --timeout=180s

      # ==========================================
      # Wait for Java Application
      # ==========================================
      - name: Wait for Java Application
        run: |
          kubectl rollout status deployment/java-demo-app \
            -n java-demo \
            --timeout=180s

      # ==========================================
      # Wait for Adminer
      # ==========================================
      - name: Wait for Adminer
        run: |
          kubectl rollout status deployment/adminer \
            -n java-demo \
            --timeout=180s

      # ==========================================
      # Verify Resources
      # ==========================================
      - name: Verify Resources
        run: |
          kubectl get all -n java-demo

      # ==========================================
      # Java Application Logs
      # ==========================================
      - name: Java Application Logs
        if: always()
        run: |
          kubectl logs deployment/java-demo-app -n java-demo || true

      # ==========================================
      # PostgreSQL Logs
      # ==========================================
      - name: PostgreSQL Logs
        if: always()
        run: |
          kubectl logs deployment/crud-postgres -n java-demo || true

      # ==========================================
      # Adminer Logs
      # ==========================================
      - name: Adminer Logs
        if: always()
        run: |
          kubectl logs deployment/adminer -n java-demo || true