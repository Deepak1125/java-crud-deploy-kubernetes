name: Kubernetes CD

on:
  repository_dispatch:
    types:
      - deploy

jobs:
  deploy:
    name: Build Docker Image and Deploy
    runs-on: self-hosted

    permissions:
      contents: read

    steps:

      # ==========================================
      # Checkout Kubernetes Repository
      # ==========================================
      - name: Checkout Kubernetes repository
        uses: actions/checkout@v4

      # ==========================================
      # Checkout Spring Boot Repository
      # ==========================================
      - name: Checkout Spring Boot repository
        uses: actions/checkout@v4
        with:
          repository: Deepak1125/spring-boot-crud-postgres-adminer
          ref: ${{ github.event.client_payload.tag }}
          path: spring-app

      # ==========================================
      # Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # Build Docker Image
      # ==========================================
      - name: Build Docker image
        shell: powershell
        working-directory: spring-app
        run: |
          docker build `
            -t deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }} `
            .

      # ==========================================
      # Push Docker Image
      # ==========================================
      - name: Push Docker image
        shell: powershell
        run: |
          docker push deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }}

      # ==========================================
      # Verify Kubernetes
      # ==========================================
      - name: Verify Kubernetes
        shell: powershell
        run: |
          kubectl version --client
          kubectl config current-context
          kubectl cluster-info
          kubectl get nodes

      # ==========================================
      # Deploy Kubernetes Manifests
      # ==========================================
      - name: Deploy Kubernetes manifests
        shell: powershell
        run: |
          kubectl apply -k k8s/

      # ==========================================
      # Update Java Image
      # ==========================================
      - name: Update Java deployment image
        shell: powershell
        run: |
          kubectl set image deployment/java-demo-app `
            java-demo=deepakchandra1125/java-demo-app:${{ github.event.client_payload.tag }} `
            -n java-demo

      # ==========================================
      # Wait for PostgreSQL
      # ==========================================
      - name: Wait for PostgreSQL
        shell: powershell
        run: |
          kubectl rollout status deployment/crud-postgres `
            -n java-demo `
            --timeout=180s

      # ==========================================
      # Wait for Java Application
      # ==========================================
      - name: Wait for Java Application
        shell: powershell
        run: |
          kubectl rollout status deployment/java-demo-app `
            -n java-demo `
            --timeout=180s

      # ==========================================
      # Wait for Adminer
      # ==========================================
      - name: Wait for Adminer
        shell: powershell
        run: |
          kubectl rollout status deployment/adminer `
            -n java-demo `
            --timeout=180s

      # ==========================================
      # Verify Resources
      # ==========================================
      - name: Verify Resources
        shell: powershell
        run: |
          kubectl get all -n java-demo

      # ==========================================
      # Java Application Logs
      # ==========================================
      - name: Java Application Logs
        if: always()
        shell: powershell
        run: |
          kubectl logs deployment/java-demo-app -n java-demo

      # ==========================================
      # PostgreSQL Logs
      # ==========================================
      - name: PostgreSQL Logs
        if: always()
        shell: powershell
        run: |
          kubectl logs deployment/crud-postgres -n java-demo

      # ==========================================
      # Adminer Logs
      # ==========================================
      - name: Adminer Logs
        if: always()
        shell: powershell
        run: |
          kubectl logs deployment/adminer -n java-demo